<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#111;
font-family:Poppins,sans-serif;
color:white;
}

.admin-box{
width:95%;
max-width:700px;
margin:20px auto;
background:#1f1f1f;
padding:20px;
border-radius:12px;
border:2px solid gold;
}

.admin-box h2{
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

.input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{
height:120px;
resize:none;
}

.btn{
width:100%;
padding:12px;
background:#ff9800;
color:white;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

.btn:hover{
background:#ff5722;
}

.home{
display:block;
margin-top:20px;
text-align:center;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<header class="top-header">
<div class="logo">
<h1>ADMIN PANEL</h1>
<p>Information Website</p>
</div>
</header>

<div class="admin-box">

<h2>Update Information</h2>

<input class="input" type="text" placeholder="Heading">

<textarea class="input" placeholder="Write information here..."></textarea>

<button class="btn">Save</button>

<a class="home" href="index.html">🏠 Back To Home</a>

</div>

</body>
</html>
