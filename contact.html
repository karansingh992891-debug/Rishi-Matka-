<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Aditya Information</title>

<link rel="stylesheet" href="style.css">

<style>

.contact-box{
width:95%;
max-width:700px;
margin:20px auto;
background:#1f1f1f;
padding:20px;
border-radius:12px;
border:2px solid gold;
}

.contact-box h2{
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

.input-box{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

textarea{
height:120px;
resize:none;
}

.send-btn{
width:100%;
padding:12px;
background:#ff9800;
color:white;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

.send-btn:hover{
background:#ff5722;
}

.home-btn{
display:block;
width:220px;
margin:20px auto;
text-align:center;
padding:12px;
background:#00c853;
color:white;
text-decoration:none;
border-radius:8px;
}

</style>

</head>

<body>

<header class="top-header">

<div class="logo">

<h1>📞 CONTACT US</h1>

<p>Aditya Information</p>

</div>

</header>

<div class="contact-box">

<h2>Send Message</h2>

<input type="text" class="input-box" placeholder="Your Name">

<input type="email" class="input-box" placeholder="Email Address">

<textarea class="input-box" placeholder="Write Your Message"></textarea>

<button class="send-btn">Send Message</button>

</div>

<a href="index.html" class="home-btn">
🏠 Back To Home
</a>

</body>
</html>
