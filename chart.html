<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charts | Aditya</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#111;
font-family:Poppins,sans-serif;
color:white;
}

.header{
background:#ff9800;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
color:white;
}

.chart-box{
background:#1f1f1f;
margin:15px;
padding:15px;
border-radius:12px;
border:2px solid #333;
}

.chart-box h2{
text-align:center;
color:#FFD700;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#ff9800;
padding:10px;
color:white;
}

td{
padding:10px;
text-align:center;
border:1px solid #444;
}

tr:nth-child(even){
background:#222;
}

tr:hover{
background:#333;
}

.home-btn{
display:block;
width:220px;
margin:25px auto;
padding:12px;
text-align:center;
background:#00c853;
color:white;
font-size:18px;
text-decoration:none;
border-radius:8px;
}

.home-btn:hover{
background:#00e676;
}

</style>

</head>

<body>

<div class="header">
📊 ADITYA INFORMATION CHART
</div>

<div class="chart-box">

<h2>Monthly Information</h2>

<table>

<tr>

<th>Date</th>

<th>Value</th>

<th>Status</th>

</tr>

<tr>
<td>01 Jul</td>
<td>--</td>
<td>Updated</td>
</tr>

<tr>
<td>02 Jul</td>
<td>--</td>
<td>Updated</td>
</tr>

<tr>
<td>03 Jul</td>
<td>--</td>
<td>Updated</td>
</tr>

<tr>
<td>04 Jul</td>
<td>--</td>
<td>Updated</td>
</tr>

<tr>
<td>05 Jul</td>
<td>--</td>
<td>Updated</td>
</tr>

</table>

</div>

<a href="index.html" class="home-btn">
🏠 Back To Home
</a>

</body>
</html>
